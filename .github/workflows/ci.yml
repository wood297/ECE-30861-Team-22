# Re-runs every automated test on each push and pull request, so a change that breaks
# behavior from an earlier phase fails here before it is merged or deployed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned so a new tool release can't fail CI without a code change
      - run: >-
          pip install -r requirements.txt ruff==0.17.1 mypy==1.19.1 bandit==1.8.6
          pip-audit==2.9.0 openapi-spec-validator==0.7.2

      - name: Lint (ruff, rules in ruff.toml)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports .
      - name: Security scan (bandit; accepted findings are marked "# nosec" with a reason)
        run: bandit -q -r . -x ./tests,./.venv
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt
      - name: API contract validation (spec.yaml is valid OpenAPI)
        run: openapi-spec-validator spec.yaml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same Python as the EC2 server (Ubuntu 24.04)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Unit, API and testing-endpoint tests, plus the cross-team acceptance suite run
      # in-process against our system (tests/test_acceptance.py) and the checks that the
      # suite still catches planted defects (tests/test_suite_validity.py)
      - run: pytest -v
