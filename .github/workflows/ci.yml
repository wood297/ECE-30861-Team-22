# Re-runs every automated test on each push and pull request, so a change that breaks
# behavior from an earlier phase fails here before it is merged or deployed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same Python as the EC2 server (Ubuntu 24.04)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Unit, API and testing-endpoint tests, plus the cross-team acceptance suite run
      # in-process against our system (tests/test_acceptance.py) and the checks that the
      # suite still catches planted defects (tests/test_suite_validity.py)
      - run: pytest -v
