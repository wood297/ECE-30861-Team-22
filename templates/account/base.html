<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Team 22 CRA documentation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem;
           line-height: 1.5; color: #1b1b1b; background: #fff; }
    header { display: flex; justify-content: space-between; align-items: center;
             border-bottom: 1px solid #ddd; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    button, .button { font: inherit; padding: .4rem .9rem; border: 1px solid #555; border-radius: 4px;
                      background: #f4f4f4; color: inherit; text-decoration: none; cursor: pointer; }
    form { display: inline; }
  </style>
</head>
<body>
  <header>
    <strong>Team 22 CRA documentation</strong>
    {% if g.identity and g.identity.via == "session" %}
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    <h1>{{ title }}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
