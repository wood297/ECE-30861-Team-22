<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1d2530" stroke-width="1.4"/>
    </marker>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a8f98" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #1d2530; stroke-width: 1.4; }
    .comp { fill: none; stroke: #1d2530; stroke-width: 1.4; }
    .node { fill: none; stroke: #5b6675; stroke-width: 1.3; stroke-dasharray: 7 5; }
    .e { stroke: #1d2530; stroke-width: 1.3; fill: none; }
    .ret { stroke: #1d2530; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .t { font-size: 13px; font-weight: bold; fill: #1d2530; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #5b6675; }
    .st { font-size: 11px; fill: #5b6675; }
    .s { font-size: 12px; fill: #1d2530; }
    .l { font-size: 11.5px; fill: #1d2530; }
    .plan { fill: #ffffff; stroke: #8a8f98; stroke-width: 1.3; stroke-dasharray: 2 3; }
    .pe { stroke: #8a8f98; stroke-width: 1.3; fill: none; stroke-dasharray: 2 3; }
    .pt { font-size: 13px; font-weight: bold; fill: #5b6675; }
    .title { font-size: 15px; font-weight: bold; fill: #1d2530; }
  </style>
  <rect width="1000" height="930" fill="#ffffff"/>
  <text class="title" x="24" y="28">Team 22 system architecture · UML component diagram · as delivered (Phase 3)</text>
  <text class="st" x="976" y="22" text-anchor="end">solid arrow: request, call or file read · dashed arrow: response</text>
  <text class="st" x="976" y="36" text-anchor="end">dotted grey: planned for Phase 4, not built yet</text>

  <g transform="translate(0,40)">
    <!-- actors -->
    <rect class="box" x="60" y="10" width="340" height="70" rx="4"/>
    <text class="st" x="230" y="28" text-anchor="middle">«actor»</text>
    <text class="s" x="230" y="46" text-anchor="middle">Compliance officers, QA leads, developers</text>
    <text class="st" x="230" y="64" text-anchor="middle">curl, Postman or scripts</text>

    <rect class="box" x="600" y="10" width="340" height="70" rx="4"/>
    <text class="st" x="770" y="28" text-anchor="middle">«actor»</text>
    <text class="s" x="770" y="46" text-anchor="middle">Course graders and other teams</text>
    <text class="st" x="770" y="64" text-anchor="middle">through a tester, or calling the system directly</text>

    <line class="e" x1="240" y1="80" x2="240" y2="161" marker-end="url(#arr)"/>
    <text class="l" x="248" y="104">1) POST /bundles {product_id, release_version} · GET /bundles/{id}</text>
    <line class="e" x1="770" y1="80" x2="770" y2="161" marker-end="url(#arr)"/>
    <text class="l" x="762" y="122" text-anchor="end">1) /tester/test/* · /system/*</text>
    <line class="ret" x1="110" y1="163" x2="110" y2="82" marker-end="url(#arr)"/>
    <text class="l" x="118" y="100">6) JSON status,</text>
    <text class="l" x="118" y="114">manifest, zip</text>

    <!-- EC2 node -->
    <rect class="node" x="30" y="130" width="940" height="630" rx="8"/>
    <text class="st" x="140" y="750">«execution environment» AWS EC2 · Ubuntu 24.04 · https://team22.13-58-35-224.sslip.io</text>

    <!-- common interface -->
    <rect class="box" x="60" y="163" width="880" height="64" rx="4"/>
    <text class="t" x="500" y="187" text-anchor="middle">«component» Pod common web-service interface</text>
    <text class="m" x="500" y="208" text-anchor="middle">Caddy (HTTPS :443) → gunicorn (1 worker, 8 threads) → wsgi.py routes by path prefix</text>

    <!-- System component -->
    <rect class="comp" x="40" y="270" width="520" height="340" rx="4"/>
    <text class="st" x="150" y="292">«component» System</text>

    <line class="e" x1="290" y1="227" x2="290" y2="308" marker-end="url(#arr)"/>
    <text class="l" x="282" y="252" text-anchor="end">2) /system/bundles…</text>
    <line class="ret" x1="110" y1="310" x2="110" y2="229" marker-end="url(#arr)"/>
    <line class="e" x1="452" y1="227" x2="452" y2="308" marker-end="url(#arr)"/>
    <text class="l" x="460" y="252">2) /system/test/*</text>

    <rect class="box" x="60" y="310" width="270" height="60" rx="4"/>
    <text class="t" x="195" y="335" text-anchor="middle">Bundle API</text>
    <text class="m" x="195" y="355" text-anchor="middle">app.py · bundles kept in memory</text>

    <rect class="box" x="360" y="310" width="185" height="60" rx="4"/>
    <text class="t" x="452" y="335" text-anchor="middle">Test endpoints</text>
    <text class="m" x="452" y="355" text-anchor="middle">selftest.py · sessions</text>

    <line class="e" x1="195" y1="370" x2="195" y2="408" marker-end="url(#arr)"/>
    <text class="l" x="203" y="393">3) process bundle</text>

    <rect class="box" x="60" y="410" width="270" height="60" rx="4"/>
    <text class="t" x="195" y="435" text-anchor="middle">Bundle compiler</text>
    <text class="m" x="195" y="455" text-anchor="middle">bundle_service.py · status + zip</text>

    <line class="e" x1="195" y1="470" x2="195" y2="508" marker-end="url(#arr)"/>
    <text class="l" x="203" y="493">4) retrieve and classify</text>

    <rect class="box" x="60" y="510" width="270" height="60" rx="4"/>
    <text class="t" x="195" y="535" text-anchor="middle">Artifact retrieval and classification</text>
    <text class="m" x="195" y="555" text-anchor="middle">artifact_pipeline.py</text>

    <polyline class="e" points="195,570 195,690 398,690" marker-end="url(#arr)"/>
    <text class="l" x="203" y="600">5) read files</text>

    <line class="e" x1="452" y1="370" x2="452" y2="658" marker-end="url(#arr)"/>
    <text class="l" x="460" y="520">lists releases</text>

    <!-- fixtures -->
    <rect class="box" x="400" y="660" width="240" height="60" rx="4"/>
    <text class="st" x="520" y="676" text-anchor="middle">«folder» single controlled source</text>
    <text class="t" x="520" y="694" text-anchor="middle">fixtures/prd-88/</text>
    <text class="m" x="520" y="711" text-anchor="middle">v1.2 · v1.3 · v1.4 (Markdown)</text>

    <!-- Tester component -->
    <rect class="comp" x="590" y="270" width="370" height="340" rx="4"/>
    <text class="st" x="600" y="292">«component» Tester</text>

    <line class="e" x1="775" y1="227" x2="775" y2="308" marker-end="url(#arr)"/>
    <text class="l" x="783" y="252">2) /tester/test/*</text>

    <rect class="box" x="610" y="310" width="330" height="60" rx="4"/>
    <text class="t" x="775" y="335" text-anchor="middle">Tester API</text>
    <text class="m" x="775" y="355" text-anchor="middle">service.py · setup · run · report</text>

    <line class="e" x1="687" y1="370" x2="687" y2="408" marker-end="url(#arr)"/>
    <text class="l" x="695" y="393">setup</text>
    <line class="e" x1="862" y1="370" x2="862" y2="408" marker-end="url(#arr)"/>
    <text class="l" x="870" y="393">run</text>

    <rect class="box" x="610" y="410" width="155" height="60" rx="4"/>
    <text class="t" x="687" y="435" text-anchor="middle">Setup handshake</text>
    <text class="m" x="687" y="455" text-anchor="middle">session.py</text>
    <rect class="box" x="785" y="410" width="155" height="60" rx="4"/>
    <text class="t" x="862" y="435" text-anchor="middle">Acceptance suite</text>
    <text class="m" x="862" y="455" text-anchor="middle">suite.py · 15 tests</text>

    <line class="e" x1="687" y1="470" x2="687" y2="508" marker-end="url(#arr)"/>
    <text class="l" x="695" y="493">uses</text>
    <line class="e" x1="800" y1="470" x2="768" y2="507" marker-end="url(#arr)"/>
    <text class="l" x="790" y="500">uses</text>
    <line class="e" x1="862" y1="470" x2="862" y2="508" marker-end="url(#arr)"/>
    <text class="l" x="870" y="493">reads</text>

    <rect class="box" x="610" y="510" width="155" height="60" rx="4"/>
    <text class="t" x="687" y="535" text-anchor="middle">HTTP client</text>
    <text class="m" x="687" y="555" text-anchor="middle">client.py</text>
    <rect class="box" x="785" y="510" width="155" height="60" rx="4"/>
    <text class="t" x="862" y="535" text-anchor="middle">Expected results</text>
    <text class="m" x="862" y="555" text-anchor="middle">oracle.json</text>

    <polyline class="e" points="940,440 952,440 952,700 642,700" marker-end="url(#arr)"/>
    <text class="l" x="797" y="694" text-anchor="middle">expected file bytes</text>

    <!-- planned external services (Phase 4) -->
    <line class="pe" x1="120" y1="570" x2="120" y2="808" marker-end="url(#parr)"/>
    <text class="st" x="128" y="790">fetch artifacts (Phase 4)</text>
    <rect class="plan" x="60" y="810" width="400" height="64" rx="4"/>
    <text class="st" x="260" y="828" text-anchor="middle">«external» planned for Phase 4</text>
    <text class="pt" x="260" y="848" text-anchor="middle">External services: GitHub, Jenkins, Jira/Confluence</text>
    <text class="st" x="260" y="866" text-anchor="middle">API credentials supplied by the deployment</text>

    <!-- target system -->
    <line class="e" x1="687" y1="570" x2="687" y2="808" marker-end="url(#arr)"/>
    <text class="l" x="695" y="788">7) HTTPS: /test/setup, /bundles…, /test/report</text>
    <rect class="box" x="560" y="810" width="380" height="54" rx="4"/>
    <text class="t" x="750" y="832" text-anchor="middle">Target system: a pod team's /system base URL</text>
    <text class="st" x="750" y="851" text-anchor="middle">when the target is ours, the request re-enters through the interface</text>
  </g>
</svg>
