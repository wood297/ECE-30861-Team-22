<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 1130" width="990" height="1130" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1d2530" stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .cls { fill: #ffffff; stroke: #1d2530; stroke-width: 1.4; }
    .div { stroke: #1d2530; stroke-width: 1.2; }
    .note { fill: #fbfaf3; stroke: #8a8f98; stroke-width: 1; }
    .e { stroke: #1d2530; stroke-width: 1.3; fill: none; }
    .dash { stroke: #8a8f98; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    .name { font-size: 14px; font-weight: bold; fill: #1d2530; }
    .st { font-size: 11px; fill: #5b6675; }
    .a { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1d2530; }
    .n { font-size: 11.5px; fill: #3d4652; }
    .lbl { font-size: 12px; fill: #1d2530; }
    .mul { font-size: 12px; fill: #1d2530; font-family: Menlo, Consolas, monospace; }
    .title { font-size: 15px; font-weight: bold; fill: #1d2530; }
    .ink { fill: #1d2530; }
  </style>
  <rect width="990" height="1130" fill="#ffffff"/>
  <text class="title" x="24" y="28">Bundle data model · UML class diagram · as delivered (Phase 4)</text>
  <g transform="translate(0,40)">
<path class="note" d="M24,10 H300 L314,24 V101 H24 Z"/>
<path class="note" d="M300,10 V24 H314" fill="none"/>
<text class="n" x="34" y="30">Storage: Python dictionaries in memory, cleared</text>
<text class="n" x="34" y="45">on restart: bundles (app.py), archives</text>
<text class="n" x="34" y="60">(bundle_service.py), _sessions (selftest.py),</text>
<text class="n" x="34" y="75">_proposals and _github_cache</text>
<text class="n" x="34" y="90">(artifact_pipeline.py).</text>
<rect class="cls" x="340" y="10" width="300" height="132"/>
<line class="div" x1="340" y1="40" x2="640" y2="40"/>
<text class="name" x="490.0" y="30" text-anchor="middle">Bundle</text>
<text class="a" x="352" y="58">bundle_id : UUID</text>
<text class="a" x="352" y="76">product_id : str</text>
<text class="a" x="352" y="94">release_version : str</text>
<text class="a" x="352" y="112">status : BundleStatus</text>
<text class="a" x="352" y="130">error : str [0..1]</text>
<path class="note" d="M666,10 H952 L966,24 V101 H666 Z"/>
<path class="note" d="M952,10 V24 H966" fill="none"/>
<text class="n" x="676" y="30">{processed on a background thread:</text>
<text class="n" x="676" y="45">status goes PENDING → PROCESSING →</text>
<text class="n" x="676" y="60">COMPLETED, PARTIAL_SUCCESS or FAILED}</text>
<text class="n" x="676" y="75">{the terminal status is set last, after</text>
<text class="n" x="676" y="90">the manifest and archive are ready}</text>
<line class="dash" x1="640" y1="60" x2="666" y2="60"/>
<polygon class="ink" points="400,142 407,152 400,162 393,152"/>
<polyline class="e" points="400,162 400,200 170,200 170,250"/>
<text class="lbl" x="285" y="193" text-anchor="middle">records</text>
<text class="mul" x="408" y="178">1</text>
<text class="mul" x="162" y="242" text-anchor="end">0..4</text>
<text class="lbl" x="178" y="242">manifest</text>
<polygon class="ink" points="580,142 587,152 580,162 573,152"/>
<polyline class="e" points="580,162 580,200 810,200 810,250"/>
<text class="lbl" x="695" y="193" text-anchor="middle">contains</text>
<text class="mul" x="588" y="178">1</text>
<text class="mul" x="802" y="242" text-anchor="end">0..4</text>
<text class="lbl" x="818" y="242">artifacts</text>
<line class="e" x1="490" y1="142" x2="490" y2="248" marker-end="url(#open)"/>
<text class="mul" x="498" y="158">1</text>
<text class="lbl" x="498" y="198">packaged as</text>
<text class="mul" x="498" y="242">0..1</text>
<rect class="cls" x="20" y="250" width="300" height="168"/>
<line class="div" x1="20" y1="280" x2="320" y2="280"/>
<text class="name" x="170.0" y="270" text-anchor="middle">ManifestItem</text>
<text class="a" x="32" y="298">category : Category</text>
<text class="a" x="32" y="316">status : CategoryStatus</text>
<text class="a" x="32" y="334">external_source : str</text>
<text class="a" x="32" y="352">source_failure_detail : str [0..1]</text>
<text class="a" x="32" y="370">source_file : str [0..1]</text>
<text class="a" x="32" y="388">classified_by : ClassifiedBy [0..1]</text>
<text class="a" x="32" y="406">classification_evidence : str [0..1]</text>
<rect class="cls" x="350" y="250" width="280" height="78"/>
<line class="div" x1="350" y1="280" x2="630" y2="280"/>
<text class="name" x="490.0" y="270" text-anchor="middle">BundleArchive</text>
<text class="a" x="362" y="298">filename : str</text>
<text class="a" x="362" y="316">data : bytes (zip)</text>
<rect class="cls" x="660" y="250" width="300" height="132"/>
<line class="div" x1="660" y1="280" x2="960" y2="280"/>
<text class="name" x="810.0" y="270" text-anchor="middle">Artifact</text>
<text class="a" x="672" y="298">category : Category</text>
<text class="a" x="672" y="316">product_id : str</text>
<text class="a" x="672" y="334">release_version : str</text>
<text class="a" x="672" y="352">source_file : str</text>
<text class="a" x="672" y="370">content : str</text>
<line class="dash" x1="170" y1="418" x2="170" y2="450"/>
<path class="note" d="M20,450 H306 L320,464 V601 H20 Z"/>
<path class="note" d="M306,450 V464 H320" fill="none"/>
<text class="n" x="30" y="470">{exactly one item per Category;</text>
<text class="n" x="30" y="485">none when Bundle.status = FAILED}</text>
<text class="n" x="30" y="500">{external_source = "fixtures", or "GitHub"</text>
<text class="n" x="30" y="515">when a SourceCatalogEntry configures it}</text>
<text class="n" x="30" y="530">{source_failure_detail only for INVALID</text>
<text class="n" x="30" y="545">and INACCESSIBLE}</text>
<text class="n" x="30" y="560">{classified_by only when the rules or</text>
<text class="n" x="30" y="575">Bedrock judged a readable file;</text>
<text class="n" x="30" y="590">classification_evidence only for bedrock}</text>
<line class="dash" x1="490" y1="328" x2="490" y2="360"/>
<path class="note" d="M350,360 H616 L630,374 V481 H350 Z"/>
<path class="note" d="M616,360 V374 H630" fill="none"/>
<text class="n" x="360" y="380">{exists only for COMPLETED and</text>
<text class="n" x="360" y="395">PARTIAL_SUCCESS}</text>
<text class="n" x="360" y="410">{each PRESENT file unchanged, named</text>
<text class="n" x="360" y="425">by its source_file, + manifest.json</text>
<text class="n" x="360" y="440">without bundle_id}</text>
<text class="n" x="360" y="455">{fixed timestamps: identical requests</text>
<text class="n" x="360" y="470">give identical archives}</text>
<line class="dash" x1="810" y1="382" x2="810" y2="410"/>
<path class="note" d="M660,410 H946 L960,424 V501 H660 Z"/>
<path class="note" d="M946,410 V424 H960" fill="none"/>
<text class="n" x="670" y="430">{one Artifact per PRESENT item;</text>
<text class="n" x="670" y="445">product_id and release_version equal</text>
<text class="n" x="670" y="460">the Bundle's}</text>
<text class="n" x="670" y="475">{content is the file's text, unmodified:</text>
<text class="n" x="670" y="490">BOM and line endings kept}</text>
<rect class="cls" x="20" y="650" width="300" height="148"/>
<line class="div" x1="20" y1="696" x2="320" y2="696"/>
<text class="st" x="170.0" y="666" text-anchor="middle">«config» source_catalog.json</text>
<text class="name" x="170.0" y="684" text-anchor="middle">SourceCatalogEntry</text>
<text class="a" x="32" y="714">source : "github"</text>
<text class="a" x="32" y="732">repository : str</text>
<text class="a" x="32" y="750">commit : str</text>
<text class="a" x="32" y="768">path : str</text>
<text class="a" x="32" y="786">format : str [0..1]</text>
<line class="dash" x1="170" y1="798" x2="170" y2="816"/>
<path class="note" d="M20,816 H306 L320,830 V907 H20 Z"/>
<path class="note" d="M306,816 V830 H320" fill="none"/>
<text class="n" x="30" y="836">{at most one per product_id/release_version</text>
<text class="n" x="30" y="851">and Category; commit is a full 40-character</text>
<text class="n" x="30" y="866">SHA, so results are repeatable}</text>
<text class="n" x="30" y="881">{file not at the commit, or GitHub fails</text>
<text class="n" x="30" y="896">→ that category is INACCESSIBLE}</text>
<rect class="cls" x="350" y="650" width="280" height="112"/>
<line class="div" x1="350" y1="696" x2="630" y2="696"/>
<text class="st" x="490.0" y="666" text-anchor="middle">«cached» Bedrock answer</text>
<text class="name" x="490.0" y="684" text-anchor="middle">ClassificationProposal</text>
<text class="a" x="362" y="714">actual_category : Category [0..1]</text>
<text class="a" x="362" y="732">evidence : str [0..1]</text>
<text class="a" x="362" y="750">error_code : str [0..1]</text>
<line class="dash" x1="490" y1="762" x2="490" y2="780"/>
<path class="note" d="M350,780 H616 L630,794 V871 H350 Z"/>
<path class="note" d="M616,780 V794 H630" fill="none"/>
<text class="n" x="360" y="800">{cached by (content sha256, prompt</text>
<text class="n" x="360" y="815">version, model); failures not cached}</text>
<text class="n" x="360" y="830">{only a proposal: code sets every</text>
<text class="n" x="360" y="845">status, and a failed or unclear answer</text>
<text class="n" x="360" y="860">can never make a category PRESENT}</text>
<rect class="cls" x="660" y="650" width="300" height="96"/>
<line class="div" x1="660" y1="680" x2="960" y2="680"/>
<text class="name" x="810.0" y="670" text-anchor="middle">TestSession</text>
<text class="a" x="672" y="698">session_id : str</text>
<text class="a" x="672" y="716">created_at : datetime</text>
<text class="a" x="672" y="734">setup : object</text>
<text class="st" x="810" y="762" text-anchor="middle">selftest.py · not linked to bundles</text>
<rect class="cls" x="20" y="925" width="225" height="148"/>
<line class="div" x1="20" y1="971" x2="245" y2="971"/>
<text class="st" x="132.5" y="941" text-anchor="middle">«enumeration»</text>
<text class="name" x="132.5" y="959" text-anchor="middle">BundleStatus</text>
<text class="a" x="32" y="989">PENDING</text>
<text class="a" x="32" y="1007">PROCESSING</text>
<text class="a" x="32" y="1025">COMPLETED</text>
<text class="a" x="32" y="1043">PARTIAL_SUCCESS</text>
<text class="a" x="32" y="1061">FAILED</text>
<rect class="cls" x="260" y="925" width="225" height="130"/>
<line class="div" x1="260" y1="971" x2="485" y2="971"/>
<text class="st" x="372.5" y="941" text-anchor="middle">«enumeration»</text>
<text class="name" x="372.5" y="959" text-anchor="middle">CategoryStatus</text>
<text class="a" x="272" y="989">PRESENT</text>
<text class="a" x="272" y="1007">MISSING</text>
<text class="a" x="272" y="1025">INVALID</text>
<text class="a" x="272" y="1043">INACCESSIBLE</text>
<rect class="cls" x="500" y="925" width="225" height="130"/>
<line class="div" x1="500" y1="971" x2="725" y2="971"/>
<text class="st" x="612.5" y="941" text-anchor="middle">«enumeration»</text>
<text class="name" x="612.5" y="959" text-anchor="middle">Category</text>
<text class="a" x="512" y="989">SBOM</text>
<text class="a" x="512" y="1007">Risk Assessment</text>
<text class="a" x="512" y="1025">Test Logs</text>
<text class="a" x="512" y="1043">User Instructions</text>
<rect class="cls" x="740" y="925" width="220" height="94"/>
<line class="div" x1="740" y1="971" x2="960" y2="971"/>
<text class="st" x="850.0" y="941" text-anchor="middle">«enumeration»</text>
<text class="name" x="850.0" y="959" text-anchor="middle">ClassifiedBy</text>
<text class="a" x="752" y="989">rules</text>
<text class="a" x="752" y="1007">bedrock</text>
</g></svg>
